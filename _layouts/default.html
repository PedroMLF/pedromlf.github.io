<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != "" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.role }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.tagline }}">
  <script>
    (function () {
      var stored = localStorage.getItem('theme');
      var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>
  <div class="wrap">
    <header class="site-head">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <div class="site-head-right">
        <nav class="site-nav">
          <a href="{{ '/#experience' | relative_url }}">Experience</a>
          <a href="{{ '/#publications' | relative_url }}">Publications</a>
          <a href="{{ '/#talks' | relative_url }}">Talks</a>
          <a href="{{ '/#teaching' | relative_url }}">Teaching</a>
          {% comment %}<a href="{{ '/blog/' | relative_url }}">Blog</a>{% endcomment %}
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle dark mode">
          <span class="icon-sun">Dark</span>
          <span class="icon-moon">Light</span>
        </button>
      </div>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-foot">
      <div class="foot-links">
        {% if site.email_reversed %}<a href="#" class="email-link" data-e="{{ site.email_reversed }}">Email</a> · {% endif %}{% for link in site.links %}<a href="{{ link.url }}">{{ link.name }}</a>{% unless forloop.last %} · {% endunless %}{% endfor %}
      </div>
      <div class="foot-meta">© {{ site.time | date: "%Y" }} {{ site.title }}</div>
    </footer>
  </div>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });

      // Email links: the address is stored reversed and shown as "name [at] domain [dot] nl" on click
      document.querySelectorAll('.email-link').forEach(function (a) {
        a.addEventListener('click', function (e) {
          e.preventDefault();
          var parts = a.getAttribute('data-e').split('').reverse().join('').split('@');
          var shown = document.createElement('span');
          shown.textContent = parts[0] + ' [at] ' + parts[1].split('.').join(' [dot] ');
          a.replaceWith(shown);
        });
      });

      // "↑ Top" link next to every section heading except the first
      var headings = document.querySelectorAll('main h2[id]');
      for (var i = 1; i < headings.length; i++) {
        var link = document.createElement('a');
        link.href = '#';
        link.className = 'to-top';
        link.textContent = '↑ Top';
        link.addEventListener('click', function (e) {
          e.preventDefault();
          window.scrollTo({ top: 0 });
          history.replaceState(null, '', location.pathname);
        });
        headings[i].appendChild(link);
      }
    })();
  </script>
</body>
</html>
